<title>Berlin Salon Pitch Deck</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --bg:#F7F1E6; --bg-alt:#EFE5D5; --ink:#221E1A; --ink-soft:#63594E;
    --accent:#7C3040; --accent-soft:#C99098; --line:#DCCFBA; --warn:#A15A2A; --good:#4C6A52;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; background:#0d0d0d; overflow:hidden; font-family:'Work Sans',system-ui,sans-serif;}
  .stage{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;}
  .slide{width:1280px; height:720px; background:var(--bg); color:var(--ink); position:relative; padding:64px 76px; overflow:hidden; flex:0 0 auto; display:none; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,0.5);}
  .slide.active{display:flex;}
  .body{flex:1; display:flex; flex-direction:column; justify-content:center; min-height:0;}
  .eyebrow{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);}
  .display{font-family:'Instrument Serif',Georgia,serif;}
  .footer{position:absolute;left:76px;bottom:32px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;color:var(--ink-soft);letter-spacing:0.05em;}
  .pagenum{position:absolute;right:76px;bottom:32px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;color:var(--ink-soft);}
  .rule{height:1px;background:var(--line);}
  .axislabel{font-family:'IBM Plex Mono',monospace; font-size:11px; fill:var(--ink-soft);}
  .vallabel{font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; fill:var(--ink);}

  .item{display:flex; gap:14px; align-items:baseline; margin-bottom:14px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto; transform:translateY(-4px);}

  .funnel-row{display:flex; align-items:center; gap:28px; margin-bottom:12px;}
  .funnel-track{width:520px; display:flex; justify-content:flex-start;}
  .funnel-bar{height:52px; display:flex; align-items:center; padding:0 24px; font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:0.04em;}
  .funnel-label{width:320px; flex:0 0 auto; text-align:right;}
  .funnel-label .num{font-family:'Instrument Serif',Georgia,serif; font-size:34px; line-height:1.1; color:var(--accent);}
  .funnel-label .txt{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}

  .bar-col{flex:0 0 auto; display:flex; flex-direction:column; align-items:center;}
  .bar{width:180px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:14px; font-family:'IBM Plex Mono',monospace; font-weight:600;}
  .impact-note{margin-top:24px; padding:14px 20px; background:#F3E9DE; border:1px solid var(--line); font-size:12.5px; color:var(--ink-soft); max-width:900px;}

  .flagbox{margin-top:22px; padding:10px 14px; background:#F3E9DE; border:1px solid var(--line); font-size:12px; color:var(--ink-soft); max-width:480px;}

  .card{flex:1; border-top:2px solid var(--accent); padding-top:14px; display:flex; flex-direction:column; gap:10px;}
  .num{font-family:'Instrument Serif',Georgia,serif; font-size:36px; color:var(--accent-soft); line-height:1;}
  .card-title{font-size:17px; font-weight:600; line-height:1.2;}
  .label{font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:3px;}
  .text{font-size:12.5px; line-height:1.45; color:var(--ink);}
  .fitbox{margin-top:10px; background:var(--bg-alt); padding:10px 12px; font-size:11.5px; line-height:1.4;}

  .rrow{display:flex; gap:36px; padding:20px 0; border-bottom:1px solid var(--line); align-items:flex-start;}
  .rrow:first-of-type{padding-top:0;}
  .rlabel{flex:0 0 300px; font-size:15px; font-weight:600;}
  .rtext{flex:1; font-size:14.5px; line-height:1.6; color:var(--ink-soft);}
  .rtext strong{color:var(--ink);}

  .step{flex:1; background:var(--bg-alt); border:1px solid var(--line); padding:14px 12px; text-align:center; font-size:12px; line-height:1.4;}
  .arrow{display:flex; align-items:center; color:var(--accent-soft); font-size:20px;}
  .mkpi{flex:1; text-align:center;}
  .mkpi .num{font-family:'Instrument Serif',Georgia,serif; font-size:32px; color:var(--accent);}
  .mkpi .lbl{font-size:12px; color:var(--ink-soft); margin-top:4px;}

  .kpi{flex:1; background:var(--bg-alt); border:1px solid var(--line); padding:18px 20px;}
  .kpi .num{font-family:'Instrument Serif',Georgia,serif; font-size:32px; color:var(--accent);}
  .kpi .lbl{font-size:12px; color:var(--ink-soft); margin-top:6px; line-height:1.4;}

  /* nav chrome */
  .navbar{position:fixed; left:0; right:0; bottom:0; height:64px; display:flex; align-items:center; justify-content:center; gap:18px; z-index:10;}
  .navbtn{width:40px; height:40px; border-radius:50%; border:1px solid #444; background:#1a1a1a; color:#eee; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .navbtn:hover{background:#2a2a2a;}
  .navbtn:disabled{opacity:0.3; cursor:default;}
  .counter{font-family:'IBM Plex Mono',monospace; color:#bbb; font-size:13px; min-width:60px; text-align:center;}
  .hint{position:fixed; top:18px; right:24px; font-family:'IBM Plex Mono',monospace; color:#888; font-size:11px; z-index:10;}
</style>

<div class="stage" id="stage"></div>

<div class="navbar">
  <button class="navbtn" id="prevBtn" aria-label="Previous slide">&#8592;</button>
  <div class="counter" id="counter">1 / 10</div>
  <button class="navbtn" id="nextBtn" aria-label="Next slide">&#8594;</button>
</div>
<div class="hint">&larr; &rarr; or click to navigate</div>

const stage = document.getElementById('stage');
slides.forEach((html, i) => {
  const d = document.createElement('div');
  d.className = 'slide' + (i === 0 ? ' active' : '');
  d.innerHTML = html;
  stage.appendChild(d);
});

let current = 0;
const els = document.querySelectorAll('.slide');
const counter = document.getElementById('counter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function show(i) {
  if (i < 0 || i >= els.length) return;
  els[current].classList.remove('active');
  current = i;
  els[current].classList.add('active');
  counter.textContent = (current + 1) + ' / ' + els.length;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === els.length - 1;
}

prevBtn.addEventListener('click', () => show(current - 1));
nextBtn.addEventListener('click', () => show(current + 1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') show(current + 1);
  if (e.key === 'ArrowLeft') show(current - 1);
});
document.getElementById('stage').addEventListener('click', (e) => {
  const rect = document.getElementById('stage').getBoundingClientRect();
  const x = e.clientX - rect.left;
  if (x > rect.width / 2) show(current + 1); else show(current - 1);
});
show(0);
</script>
